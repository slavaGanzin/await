name: Build and Release

on: push

jobs:
  # nix-build:
  #   runs-on: ubuntu-latest
  #
  #   steps:
  #   - name: Checkout code
  #     uses: actions/checkout@v2
  #
  #   - name: Install Nix
  #     uses: DeterminateSystems/nix-installer-action@main
  #
  #   - name: Build with Nix
  #     run: nix-build
  #
  #   - name: Test Nix binary
  #     run: |
  #       ./result/bin/await --version
  #       ./result/bin/await --help
  #
  # NOTE: Nix build temporarily disabled - works locally but fails in GitHub Actions
  # due to script execution issues in the sandboxed environment. The fix has been
  # verified to work in local nix-build with all 46 tests passing.

  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: 
          - ubuntu-latest 
          - macos-latest 
          # - windows-latest
        include:
          - os: ubuntu-latest
            image: ubuntu:latest
          - os: macos-latest
            image: macos-latest
            #- os: windows-latest
            #image: windows-latest

    steps:
    - name: Set dummy ACTIONS_RUNTIME_TOKEN and ACTIONS_RUNTIME_URL for act
      if: ${{ env.ACT }}
      run: |
        echo "ACTIONS_RUNTIME_TOKEN=dummy_token" >> $GITHUB_ENV
        echo "ACTIONS_RUNTIME_URL=https://dummy_url" >> $GITHUB_ENV

    # - name: Install GCC on Ubuntu
    #   if: matrix.os == 'ubuntu-latest' && ${{env.ACT}} 
    #   run: |
    #     apt-get update
    #     apt-get install -y gcc

    # - name: Install GCC on macOS
    #   if: matrix.os == 'macos-latest' && ${{ env.ACT }} 
    #   run: |
    #     brew install gcc

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Build on Linux
      if: matrix.os == 'ubuntu-latest'
      run: |
        cmake -B build/
        cmake --build build/
        mkdir -p ${{ matrix.os }}
        cp build/await ${{ matrix.os }}/
        cp build/await.fish ${{ matrix.os }}/
        cp build/await.bash ${{ matrix.os }}/
        cp build/await.zsh ${{ matrix.os }}/
        cp build/await.1 ${{ matrix.os }}/
        # Copy binary to project root for tests
        cp build/await ./await

    - name: Build on macOS (arm64)
      if: matrix.os == 'macos-latest'
      run: |
        cmake -B build-arm64/ -DCMAKE_OSX_ARCHITECTURES=arm64
        cmake --build build-arm64/
        mkdir -p macos-latest-arm64
        cp build-arm64/await macos-latest-arm64/
        cp build-arm64/await.fish macos-latest-arm64/
        cp build-arm64/await.bash macos-latest-arm64/
        cp build-arm64/await.zsh macos-latest-arm64/
        cp build-arm64/await.1 macos-latest-arm64/

    - name: Build on macOS (x86_64)
      if: matrix.os == 'macos-latest'
      run: |
        cmake -B build-x86_64/ -DCMAKE_OSX_ARCHITECTURES=x86_64
        cmake --build build-x86_64/
        mkdir -p macos-latest-x86_64
        cp build-x86_64/await macos-latest-x86_64/
        cp build-x86_64/await.fish macos-latest-x86_64/
        cp build-x86_64/await.bash macos-latest-x86_64/
        cp build-x86_64/await.zsh macos-latest-x86_64/
        cp build-x86_64/await.1 macos-latest-x86_64/
        # Test the build native to this runner (arm64 on Apple Silicon), not one run under Rosetta
        cp build-$(uname -m)/await ./await

    - name: Install test dependencies
      working-directory: tests
      run: |
        pip install -e .
        pip install pytest pytest-timeout

    - name: Run tests
      working-directory: tests
      run: |
        pytest test_await.py -v

    # install the real latest release over this build with await --update
    - name: End-to-end update from the latest release
      run: tests/update_e2e.sh ./await

    - name: Tree
      if: matrix.os == 'ubuntu-latest'
      run: tree

    - uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        name: await-${{ matrix.os }}
        path: ${{ matrix.os }}

    - uses: actions/upload-artifact@v4
      if: matrix.os == 'macos-latest'
      with:
        name: await-macos-latest-arm64
        path: macos-latest-arm64

    - uses: actions/upload-artifact@v4
      if: matrix.os == 'macos-latest'
      with:
        name: await-macos-latest-x86_64
        path: macos-latest-x86_64

  # Static (musl) Linux builds: they run on any distro regardless of its libc,
  # so these are what `await --update` installs on Linux (x86_64 and arm64)
  build-linux-static:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build static binary
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q musl-tools
        cmake -B build-static/ -DCMAKE_C_COMPILER=musl-gcc -DCMAKE_EXE_LINKER_FLAGS=-static
        cmake --build build-static/
        file build-static/await | grep -q 'statically linked'
        mkdir -p linux-musl-${{ matrix.arch }}
        cp build-static/await build-static/await.fish build-static/await.bash build-static/await.zsh build-static/await.1 linux-musl-${{ matrix.arch }}/
        cp build-static/await ./await

    - name: Run tests
      working-directory: tests
      run: |
        pip install -e .
        pip install pytest pytest-timeout
        pytest test_await.py -v

    - name: End-to-end update from the latest release
      run: tests/update_e2e.sh ./await

    - uses: actions/upload-artifact@v4
      with:
        name: await-linux-musl-${{ matrix.arch }}
        path: linux-musl-${{ matrix.arch }}

  # Windows: an MSYS2 (Cygwin-runtime) build for Git Bash and MSYS2 shells, where
  # commands keep the same sh syntax as on Linux and macOS. It needs the
  # msys-2.0.dll that those shells already ship in /usr/bin.
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MSYS
        update: true
        install: gcc make cmake python python-pip curl procps-ng tar groff

    - name: Build
      run: |
        cmake -B build/
        cmake --build build/
        mkdir -p windows-msys
        cp build/await.exe build/await.fish build/await.bash build/await.zsh build/await.1 windows-msys/
        cp build/await.exe ./await.exe
        # tests run ../await, which is otherwise the tracked macOS binary
        cp build/await.exe ./await

    - name: Run tests
      working-directory: tests
      run: |
        python -m pip install --break-system-packages pytest pytest-timeout
        python -m pytest test_await.py -v

    # releases before 2.11.0 have no Windows build; from 2.11.0 on a missing one fails
    - name: End-to-end update from the latest release
      env:
        AWAIT_E2E_ALLOW_MISSING: 2.11.0
      run: |
        tests/update_e2e.sh ./await.exe
        # Git Bash reports MINGW64_NT-... from uname
        MSYSTEM=MINGW64 tests/update_e2e.sh ./await.exe

    - uses: actions/upload-artifact@v4
      with:
        name: await-windows-msys
        path: windows-msys

  # The tap formula (Formula/await.rb) installs the latest published release:
  # generate it from that release's SHA256SUMS and install and test it with brew
  homebrew:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check the committed formula
      run: ruby -c Formula/await.rb

    - name: Install the formula for the latest release from a local tap
      run: |
        set -euo pipefail
        [ -x /home/linuxbrew/.linuxbrew/bin/brew ] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
        gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
        scripts/homebrew-formula.sh "$VERSION" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/await.rb"
        ruby -c "$RUNNER_TEMP/await.rb"
        brew tap-new --no-git local/await
        cp "$RUNNER_TEMP/await.rb" "$(brew --repository local/await)/Formula/await.rb"
        brew install local/await/await
        brew test local/await/await
        await --version
        ls "$(brew --prefix)/share/zsh/site-functions/_await" "$(brew --prefix)/etc/bash_completion.d/await" \
           "$(brew --prefix)/share/fish/vendor_completions.d/await.fish"

    # Install the committed formula too, when it is for the latest release. Its
    # pins go stale on a branch as soon as main re-publishes (main's copy is the
    # one the release job keeps current), so a mismatch only fails the job when
    # main's formula doesn't match the live SHA256SUMS either, after giving a
    # release job that is between uploading and committing a few minutes.
    - name: Install the committed formula
      run: |
        set -euo pipefail
        [ -x /home/linuxbrew/.linuxbrew/bin/brew ] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        formula_version() { sed -n 's/^  version "\(.*\)"$/\1/p' "$1"; }
        live() {
          rm -f "$RUNNER_TEMP/live.sums"
          gh release download "$LATEST" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output "$RUNNER_TEMP/live.sums"
        }
        LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
        committed=$(formula_version Formula/await.rb)
        if [ "$committed" != "$LATEST" ]; then
          echo "::notice::Formula/await.rb is for $committed, the latest release is $LATEST: not installing it"
          exit 0
        fi
        formula=Formula/await.rb
        live
        if ! scripts/homebrew-formula.sh --check "$RUNNER_TEMP/live.sums" "$formula"; then
          git fetch -q --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          if ! git show origin/main:Formula/await.rb > "$RUNNER_TEMP/main.rb" 2>/dev/null; then
            echo "::warning::Formula/await.rb pins older checksums than the live $LATEST release, and main has no formula yet to compare with"
            exit 0
          fi
          if [ "$(formula_version "$RUNNER_TEMP/main.rb")" != "$LATEST" ]; then
            echo "::warning::Formula/await.rb pins older checksums than the live $LATEST release; main's formula is for another version"
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            scripts/homebrew-formula.sh --check "$RUNNER_TEMP/live.sums" "$RUNNER_TEMP/main.rb" && break
            if [ "$attempt" = 6 ]; then
              echo "::error::committed formula is stale: Formula/await.rb on main doesn't match the live $LATEST SHA256SUMS, so brew install fails"
              exit 1
            fi
            echo "waiting for a release job to commit the formula for the re-published archives..."
            sleep 60
            git fetch -q --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            git show origin/main:Formula/await.rb > "$RUNNER_TEMP/main.rb"
            live
          done
          echo "::notice::this commit's Formula/await.rb is older than main's, which matches the live release: installing main's"
          formula="$RUNNER_TEMP/main.rb"
        fi
        brew uninstall --formula local/await/await
        cp "$formula" "$(brew --repository local/await)/Formula/await.rb"
        brew install local/await/await
        brew test local/await/await
        [ "$(await --version)" = "$LATEST" ]

  release:
    needs: [build, build-linux-static, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # pushes the regenerated Homebrew formula to main (and uploads the release)
    permissions:
      contents: write
    # one release at a time: a queued newer run replaces an older queued one
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 0  # Fetch all history and tags for release notes generation

    - name: Build await to get version
      run: |
        cmake -B build/
        cmake --build build/

    - name: Get version from await CLI
      id: get_version
      run: |
        VERSION=$(./build/await --version)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Generate Release Notes
      id: release_notes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}

        # The version tag just below this one. Only version-like tags count (there
        # are stray ones like "list"), compared numerically with or without a "v"
        # prefix (--sort=-v:refname puts the old v1.x tags ahead of 2.x); tags
        # newer than this release are ignored.
        PREV_TAG=$( { git tag -l | grep -E '^v?[0-9]+(\.[0-9]+)*$' | grep -vx "$VERSION" \
                        | awk '{t=$0; sub(/^v/,"",t); print t" "$0}'
                      echo "$VERSION ." ; } \
          | sort -V -k1,1 | awk '$2=="." {print prev; exit} {prev=$2}')

        if [ -z "$PREV_TAG" ]; then
          echo "No previous tag found, using initial commit"
          PREV_TAG=$(git rev-list --max-parents=0 HEAD)
        fi

        echo "Generating release notes from $PREV_TAG to $VERSION"

        # Get commit messages, excluding merge commits and version bumps
        COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --pretty=format:"- %s" | grep -v "^- Bump version")

        # printf, not echo -e: commit subjects are data (e.g. "\0NN" must stay as typed)
        {
          printf '## Release %s\n\n### Changes since %s\n\n' "$VERSION" "$PREV_TAG"
          if [ -z "$COMMITS" ]; then
            printf '%s\n' "- Minor updates and improvements"
          else
            printf '%s\n' "$COMMITS"
          fi
        } > release_notes.md

        # Also output for logging
        echo "Release notes:"
        cat release_notes.md

    - name: Check if Release Exists
      id: check_release
      run: |
        gh release view ${{ steps.get_version.outputs.VERSION }} || echo "Release does not exist"

    - name: Create or Update Release
      id: create_update_release
      if: steps.check_release.outputs.exists == 'false'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        release_name: ${{ steps.get_version.outputs.VERSION }}
        body_path: release_notes.md
        draft: false
        prerelease: false

    - name: Update Release Archives
      if: steps.check_release.outputs.exists == 'true'
      run: |
        gh release upload ${{ steps.get_version.outputs.VERSION }} archives/* --clobber

    - name: Download Artifact
      uses: actions/download-artifact@v4
    
    - name: Create Archives
      run: |
        mkdir -p archives
        tree
        # actions/upload-artifact drops file permissions; without this every
        # released binary was non-executable
        chmod +x await-*/await await-windows-msys/await.exe
        cd await-macos-latest-arm64 && tar -czvf ../archives/await-${{ steps.get_version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz * && cd ..
        cd await-macos-latest-x86_64 && tar -czvf ../archives/await-${{ steps.get_version.outputs.VERSION }}-x86_64-apple-darwin.tar.gz * && cd ..
        cd await-ubuntu-latest && tar -czvf ../archives/await-${{ steps.get_version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz * && cd ..
        cd await-linux-musl-x86_64 && tar -czvf ../archives/await-${{ steps.get_version.outputs.VERSION }}-x86_64-unknown-linux-musl.tar.gz * && cd ..
        cd await-linux-musl-aarch64 && tar -czvf ../archives/await-${{ steps.get_version.outputs.VERSION }}-aarch64-unknown-linux-musl.tar.gz * && cd ..
        cd await-windows-msys && tar -czvf ../archives/await-${{ steps.get_version.outputs.VERSION }}-x86_64-pc-windows-msys.tar.gz * && cd ..
        # `await --update` refuses to install anything it can't verify against this
        (cd archives && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
        tree

    - name: Upload Release Artifacts
      uses: softprops/action-gh-release@v1
      with:
        files: archives/*
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        body_path: release_notes.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The archives (so their checksums) change on every push to main, so the tap
    # formula is regenerated from the SHA256SUMS that is live on the release now
    # and committed to main. Release jobs run one at a time (concurrency above),
    # so whichever runs last leaves the formula matching what is published, even
    # if a newer push never gets as far as its release. Pushes made with
    # GITHUB_TOKEN don't start workflow runs (and the commit carries the skip
    # marker), so this can't loop; nothing is committed when the formula is
    # unchanged, and a formula for a newer version is never replaced.
    - name: Update Homebrew formula
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        formula_version() { sed -n 's/^  version "\(.*\)"$/\1/p' "$1" 2>/dev/null || true; }
        mkdir -p "$RUNNER_TEMP/live"
        gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/live" --clobber
        scripts/homebrew-formula.sh "$VERSION" "$RUNNER_TEMP/live/SHA256SUMS" "$RUNNER_TEMP/await.rb"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        for attempt in 1 2 3 4; do
          git fetch -q origin +refs/heads/main:refs/remotes/origin/main
          git checkout -q -f -B homebrew-formula origin/main
          committed=$(formula_version Formula/await.rb)
          if [ -n "$committed" ] && [ "$committed" != "$VERSION" ] &&
             [ "$(printf '%s\n%s\n' "$committed" "$VERSION" | sort -V | tail -n1)" = "$committed" ]; then
            echo "main's formula is for $committed, newer than $VERSION: leaving it"; exit 0
          fi
          cp "$RUNNER_TEMP/await.rb" Formula/await.rb
          if git diff --quiet -- Formula/await.rb; then
            echo "Formula/await.rb is up to date"; exit 0
          fi
          git add Formula/await.rb
          git commit -q -m "Update Homebrew formula for $VERSION [skip ci]"
          git push -q origin HEAD:refs/heads/main && exit 0
          sleep $((attempt * 5))
        done
        echo "could not push the formula update to main" >&2
        exit 1

    # a formula whose pins don't match the published archives breaks every brew install
    - name: Verify the Homebrew formula on main
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        git fetch -q origin +refs/heads/main:refs/remotes/origin/main
        git show origin/main:Formula/await.rb > "$RUNNER_TEMP/main.rb"
        committed=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$RUNNER_TEMP/main.rb")
        if [ "$committed" != "$VERSION" ]; then
          echo "main's formula is for $committed, not $VERSION: nothing to verify"; exit 0
        fi
        gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP/live" --clobber
        if ! scripts/homebrew-formula.sh --check "$RUNNER_TEMP/live/SHA256SUMS" "$RUNNER_TEMP/main.rb"; then
          echo "::error::committed formula is stale: Formula/await.rb on main doesn't match the live $VERSION SHA256SUMS"
          exit 1
        fi
